name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags e.g., v1.0.0

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci --loglevel=error

      - name: Generate Windows Icon
        run: node scripts/build-icon.js

      # Build the Next.js frontend
      - name: Build Next.js
        run: npm run build

      # Rebuild native dependencies (like better-sqlite3) for the Electron target
      - name: Rebuild Native Dependencies
        run: npx electron-builder install-app-deps

      - name: Kill lingering processes
        run: Get-Process split -ErrorAction SilentlyContinue | Stop-Process -Force
        shell: powershell

      # Package the Electron App and Upload to GitHub Releases
      - name: Build & Publish Electron App
        run: npx electron-builder --publish always || (echo "Build failed, retrying in 15 seconds to avoid EBUSY locks..." && Start-Sleep -Seconds 15 && npx electron-builder --publish always)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          WIN_CSC_LINK: ""
